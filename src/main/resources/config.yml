# How long a pending /tpa or /tpahere request stays valid before expiring.
request-expire-seconds: 60

# Delay between /tpaccept and the actual teleport.
# During this window, /tpacancel can interrupt the teleport.
teleport-delay-seconds: 5

# Cooldown groups for /tpa and /tpahere senders.
# Order matters: the first group whose permission the player has wins.
cooldown-groups:
  vip:
    permission: "onewaytpa.cooldown.vip"
    seconds: 10
  member:
    permission: "onewaytpa.cooldown.member"
    seconds: 20
  default:
    permission: ""
    seconds: 30
