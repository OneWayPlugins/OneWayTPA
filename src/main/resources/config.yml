# Seconds before a pending /tpa or /tpahere request expires.
request-expire-seconds: 60

# Seconds between /tpaccept and the actual teleport (warmup).
teleport-delay-seconds: 5

# Re-read the destination at teleport time instead of capturing it at /tpaccept.
teleport-to-live-location: false

# /tpacancel behaviour. When both flags are off, /tpacancel is fully disabled.
tpacancel:
  # Sender can /tpacancel to retract their own pending outgoing requests.
  retract-pending: true
  # /tpacancel interrupts an in-flight warmup.
  cancel-warmup: true

# Clear the sender's cooldown after their request is accepted.
reset-cooldown-on-accept: true

# Clear the sender's cooldown after their request is denied.
reset-cooldown-on-deny: true

# Apply auto-accept (/tpauto) to /tpahere requests as well as /tpa.
auto-accept-includes-tpahere: false

# Cancel the teleport if the player moves to a different block during warmup.
cancel-on-move: true

# /tpaccept and /tpadeny without args target the most recent pending request.
accept-most-recent-without-args: true

# Seconds of damage immunity after a successful teleport. 0 to disable.
post-teleport-invulnerability-seconds: 0

# When true, OneWayTPA honours bypass and override permissions
# (e.g. onewaytpa.bypass.move, onewaytpa.warmup.<seconds>).
permission-bypasses-enabled: true

# Default UI mode per flow for players who have not set a preference.
# "gui" opens an inventory; "chat" uses the existing clickable chat prompts.
ui-defaults:
  receive: chat
  send: chat
  pending: chat

# Log request flow events as INFO. Off keeps the console clean.
log-events: false

# Cooldown groups for /tpa senders.
# Order matters: first matching permission wins; empty permission = fallback.
cooldown-groups:
  vip:
    permission: "onewaytpa.cooldown.vip"
    seconds: 10
  member:
    permission: "onewaytpa.cooldown.member"
    seconds: 20
  default:
    permission: ""
    seconds: 30

# Runtime command aliases: alias -> canonical command name.
command-aliases:
  tpaauto: tpauto
