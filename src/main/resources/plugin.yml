name: OneWayTPA
version: '${version}'
main: net.onewaycraft.oneWayTPA.OneWayTPA
api-version: '1.21'
folia-supported: true
description: One-way TPA plugin for Paper and Folia. Players can request teleports that resolve in one direction with a configurable warmup.
authors: [Lucas Santoro]
website: https://github.com/lucas-santoro/OneWayTPA
commands:
  tpa:
    description: Send a request to teleport to another player.
    usage: /tpa <player>
    permission: onewaytpa.tpa
  tpahere:
    description: Send a request to bring another player to you.
    usage: /tpahere <player>
    permission: onewaytpa.tpahere
  tpaccept:
    description: Accept a pending teleport request.
    usage: /tpaccept <player>
    permission: onewaytpa.tpaccept
  tpadeny:
    description: Deny a pending teleport request.
    usage: /tpadeny <player>
    permission: onewaytpa.tpadeny
  tpauto:
    description: Toggle auto-accept globally, or for a specific player.
    usage: /tpauto [player]
    permission: onewaytpa.tpauto
  tpaignore:
    description: Ignore teleport requests globally or from a specific player.
    usage: /tpaignore [player]
    permission: onewaytpa.tpaignore
  tpacancel:
    description: Cancel a pending teleport during the warmup window.
    usage: /tpacancel
    permission: onewaytpa.tpacancel
  tpaprofile:
    description: View or change your OneWayTPA UI preferences.
    usage: /tpaprofile [gui <flow> <on|off> | reset]
    permission: onewaytpa.profile
  tpareload:
    description: Reload OneWayTPA configuration and messages.
    usage: /tpareload
    permission: onewaytpa.reload
  onewaytpa:
    description: OneWayTPA admin meta-command (console-friendly).
    usage: /onewaytpa <reload|version|cancel|info> [player]
    permission: onewaytpa.admin
permissions:
  onewaytpa.*:
    description: All OneWayTPA permissions.
    default: op
    children:
      onewaytpa.tpa: true
      onewaytpa.tpahere: true
      onewaytpa.tpaccept: true
      onewaytpa.tpadeny: true
      onewaytpa.tpauto: true
      onewaytpa.tpaignore: true
      onewaytpa.tpacancel: true
      onewaytpa.reload: true
      onewaytpa.admin: true
  onewaytpa.use:
    description: Basic TPA usage permissions.
    default: true
    children:
      onewaytpa.tpa: true
      onewaytpa.tpahere: true
      onewaytpa.tpaccept: true
      onewaytpa.tpadeny: true
      onewaytpa.tpauto: true
      onewaytpa.tpaignore: true
      onewaytpa.tpacancel: true
      onewaytpa.profile: true
  onewaytpa.tpa:
    description: Allows using /tpa.
    default: true
  onewaytpa.tpahere:
    description: Allows using /tpahere.
    default: true
  onewaytpa.tpaccept:
    description: Allows using /tpaccept.
    default: true
  onewaytpa.tpadeny:
    description: Allows using /tpadeny.
    default: true
  onewaytpa.tpauto:
    description: Allows using /tpauto (global toggle and per-player toggles).
    default: true
  onewaytpa.tpaauto:
    description: Legacy permission node from OneWayTPA 1.x. Grants onewaytpa.tpauto for backward compatibility.
    default: false
    children:
      onewaytpa.tpauto: true
  onewaytpa.tpaignore:
    description: Allows using /tpaignore.
    default: true
  onewaytpa.tpacancel:
    description: Allows using /tpacancel.
    default: true
  onewaytpa.profile:
    description: Allows using /tpaprofile to view and change UI preferences.
    default: true
  onewaytpa.reload:
    description: Allows using /tpareload.
    default: op
  onewaytpa.admin:
    description: Grants access to all /onewaytpa admin subcommands.
    default: op
    children:
      onewaytpa.admin.reload: true
      onewaytpa.admin.version: true
      onewaytpa.admin.cancel: true
      onewaytpa.admin.info: true
  onewaytpa.admin.reload:
    description: Allows /onewaytpa reload.
    default: op
  onewaytpa.admin.version:
    description: Allows /onewaytpa version.
    default: op
  onewaytpa.admin.cancel:
    description: Allows /onewaytpa cancel <player>.
    default: op
  onewaytpa.admin.info:
    description: Allows /onewaytpa info <player>.
    default: op
  onewaytpa.bypass.*:
    description: All bypass permissions for OneWayTPA toggles.
    default: false
    children:
      onewaytpa.bypass.move: true
  onewaytpa.bypass.move:
    description: Allows the holder to move during a teleport warmup without cancelling it.
    default: false
